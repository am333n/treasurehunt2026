<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>United We Stand</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f4f1ea;
    font-family: 'Segoe UI', Arial, sans-serif;
    padding: 20px;
  }
  .card {
    background: #ffffff;
    border: 14px solid #1a1a1a;
    border-radius: 4px;
    max-width: 700px;
    width: 100%;
    padding: 30px 25px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }
  .quote {
    font-size: clamp(22px, 5vw, 34px);
    color: #222;
    text-align: center;
    line-height: 1.3;
    margin: 0;
  }
  .author {
    font-size: clamp(14px, 3vw, 18px);
    color: #444;
    align-self: flex-end;
    margin-top: -10px;
  }
  svg {
    width: 100%;
    max-width: 320px;
    height: auto;
  }
</style>
</head>
<body>
  <div class="card">
    <p class="quote">"Even the weak become strong when they are united"</p>
    <p class="author">- Friedrich von Schiller</p>
    <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
      <!-- ink splatter -->
      <g fill="#111">
        <ellipse cx="200" cy="210" rx="70" ry="55"/>
        <circle cx="150" cy="170" r="8"/>
        <circle cx="255" cy="180" r="6"/>
        <circle cx="230" cy="255" r="7"/>
        <circle cx="165" cy="250" r="5"/>
        <circle cx="200" cy="150" r="4"/>
      </g>
      <!-- hands arranged in a circle, pointing inward -->
      <g transform="translate(200,205)">
        <!-- orange hand top-right -->
        <g transform="rotate(-20) translate(0,-110)" fill="#e8823c">
          <path d="M-30,40 L-30,-10 Q-30,-25 -20,-25 Q-12,-25 -12,-10 L-12,-40 Q-12,-52 -2,-52 Q8,-52 8,-40 L8,-42 Q8,-54 18,-54 Q28,-54 28,-42 L28,-38 Q28,-48 37,-48 Q46,-48 46,-38 L46,10 Q46,45 15,45 Z"/>
        </g>
        <!-- purple hand upper-left -->
        <g transform="rotate(-70) translate(0,-110)" fill="#5b4b9a">
          <path d="M-30,40 L-30,-10 Q-30,-25 -20,-25 Q-12,-25 -12,-10 L-12,-40 Q-12,-52 -2,-52 Q8,-52 8,-40 L8,-42 Q8,-54 18,-54 Q28,-54 28,-42 L28,-38 Q28,-48 37,-48 Q46,-48 46,-38 L46,10 Q46,45 15,45 Z"/>
        </g>
        <!-- red hand left -->
        <g transform="rotate(-140) translate(0,-110)" fill="#d1495b">
          <path d="M-30,40 L-30,-10 Q-30,-25 -20,-25 Q-12,-25 -12,-10 L-12,-40 Q-12,-52 -2,-52 Q8,-52 8,-40 L8,-42 Q8,-54 18,-54 Q28,-54 28,-42 L28,-38 Q28,-48 37,-48 Q46,-48 46,-38 L46,10 Q46,45 15,45 Z"/>
        </g>
        <!-- yellow hand bottom -->
        <g transform="rotate(155) translate(0,-110)" fill="#d9c53c">
          <path d="M-30,40 L-30,-10 Q-30,-25 -20,-25 Q-12,-25 -12,-10 L-12,-40 Q-12,-52 -2,-52 Q8,-52 8,-40 L8,-42 Q8,-54 18,-54 Q28,-54 28,-42 L28,-38 Q28,-48 37,-48 Q46,-48 46,-38 L46,10 Q46,45 15,45 Z"/>
        </g>
        <!-- blue hand bottom-right -->
        <g transform="rotate(90) translate(0,-110)" fill="#4bb3d9">
          <path d="M-30,40 L-30,-10 Q-30,-25 -20,-25 Q-12,-25 -12,-10 L-12,-40 Q-12,-52 -2,-52 Q8,-52 8,-40 L8,-42 Q8,-54 18,-54 Q28,-54 28,-42 L28,-38 Q28,-48 37,-48 Q46,-48 46,-38 L46,10 Q46,45 15,45 Z"/>
        </g>
        <!-- green hand right -->
        <g transform="rotate(30) translate(0,-110)" fill="#6bb84a">
          <path d="M-30,40 L-30,-10 Q-30,-25 -20,-25 Q-12,-25 -12,-10 L-12,-40 Q-12,-52 -2,-52 Q8,-52 8,-40 L8,-42 Q8,-54 18,-54 Q28,-54 28,-42 L28,-38 Q28,-48 37,-48 Q46,-48 46,-38 L46,10 Q46,45 15,45 Z"/>
        </g>
      </g>
    </svg>
  </div>
</body>
</html>
